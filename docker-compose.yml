# 서버(사내 71번) 배포용 — 로컬 Windows PC는 Docker 없이 네이티브 실행 (CLAUDE.md Operations 참고)
# 메모리 예약/상한: 공용 서버라 과예약 방지 — reservations 합계 ~816M, limits 합계 ~3.0G.
# docker compose v2는 swarm 없이도 deploy.resources.limits/reservations(memory)를 적용한다.
services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      # 서버 엣지 nginx(443/80)와 충돌하지 않는 비특권 포트
      - "${APP_PORT:-3333}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  frontend:
    build:
      context: ./frontend
    environment:
      # Next.js standalone 런타임 V8 old-space 힙 상한(MB) — 무제한 성장 방지
      NODE_OPTIONS: --max-old-space-size=512
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          # V8 힙 512M + 네이티브/버퍼 오버헤드 여유분
          memory: 768M
        reservations:
          memory: 256M

  backend:
    build: ./backend
    environment:
      # glibc malloc arena 수 제한 — uvicorn 스레드별 arena 증식으로 인한 RSS 팽창 방지 (python:3.11-slim = glibc)
      MALLOC_ARENA_MAX: "2"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-processmap}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:-processmap}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_MODE: ${AUTH_MODE:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_JWT_TTL_HOURS: ${AUTH_JWT_TTL_HOURS:-8}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      CHECKOUT_TTL_MINUTES: ${CHECKOUT_TTL_MINUTES:-30}
      # 편집용 매뉴얼 사이트 버튼(F9) — 비우면 에디터 툴바에서 숨김
      MANUAL_URL: ${MANUAL_URL:-}
      # CSV 임포트 안내 문서 버튼 — 비우면 CSV 액션에서 숨김. MANUAL_URL(편집 매뉴얼)과 별개
      CSV_MANUAL_URL: ${CSV_MANUAL_URL:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_TOKEN: ${AI_API_TOKEN:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      # 응답 max_tokens 상한(사고 토큰 포함) — 작으면 GLM-5.2 빈 응답
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-8000}
      EMBED_URL: ${EMBED_URL:-}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      EMBED_TIMEOUT_SECONDS: ${EMBED_TIMEOUT_SECONDS:-30}
      # AI 호출 동시성 상한 (인터뷰 등 백그라운드 호출 포함)
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-4}
      # 인터뷰 턴당 AI 제시 선택지 개수
      INTERVIEW_CHOICE_COUNT: ${INTERVIEW_CHOICE_COUNT:-2}
      # 인터뷰 첨부파일 컨텍스트 예산(문자 수)
      INTERVIEW_CONTEXT_BUDGET: ${INTERVIEW_CONTEXT_BUDGET:-12000}
      # 다중 엔드포인트+모델(JSON 배열) — 비우면 위 단일 AI_* 사용 (.env.example 참고)
      AI_ENDPOINTS: ${AI_ENDPOINTS:-}
      # 사내 AD(LDAP) 동기화 (design 2026-06-16) — 비우면 동기화 비활성(.env로 주입, 시크릿 포함)
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_CREDENTIALS: ${LDAP_BIND_CREDENTIALS:-}
      LDAP_USER_SEARCH_BASE: ${LDAP_USER_SEARCH_BASE:-}
      LDAP_START_TLS: ${LDAP_START_TLS:-false}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      SYSTEM_ADMIN_LOGIN_IDS: ${SYSTEM_ADMIN_LOGIN_IDS:-}
      # BPM 시스템 관리자 loginId(콤마 구분) — 누락 시 서버에 sysadmin 부재(auth ON에선 전원 비관리자)
      BPM_SYSADMINS: ${BPM_SYSADMINS:-}
      # 사내 n8n HR 웹훅 동기화 (design 2026-08-10) — 비우면 동기화 비활성(.env로 주입, 시크릿 포함)
      N8N_HR_URL: ${N8N_HR_URL:-}
      N8N_HR_TOKEN: ${N8N_HR_TOKEN:-}
      N8N_POSITION_URL: ${N8N_POSITION_URL:-}
      HR_SYNC_INTERVAL_HOURS: ${HR_SYNC_INTERVAL_HOURS:-24}
      HR_SYNC_DELETE_CAP_PCT: ${HR_SYNC_DELETE_CAP_PCT:-20}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          # AI 인터뷰/임베딩 컨텍스트 버퍼 포함 상한
          memory: 1G
        reservations:
          memory: 256M

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-processmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-processmap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-processmap} -d ${POSTGRES_DB:-processmap}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # 일간 DB 백업 사이드카 — 정책·복구 절차: docs/deploy/backup.md
  db-backup:
    image: postgres:16-alpine  # db와 동일 이미지 — pg_dump 버전 호환 보장, 추가 다운로드 없음
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-processmap}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: ${POSTGRES_DB:-processmap}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/db-backup.sh:/db-backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/db-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    # 백업 루프가 죽으면 조용히 백업이 멈추므로 자동 재기동 (다른 서비스는 기존 정책 유지)
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes:
  pgdata:

# 서버(사내 71번) 기본 브리지 서브넷이 사내망 대역과 충돌 → 명시 대역으로 고정
networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.36.0.0/16
          gateway: 172.36.0.1

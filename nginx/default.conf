# 앱 내부 리버스 프록시 — compose가 80을 호스트 3333에 매핑 (서버 엣지 nginx와 별개).
# 라우팅: /api → backend(FastAPI), 나머지 → frontend(Next.js)

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 인터뷰 턴은 순차 AI 호출 3~4회로 기본 60s를 초과 — 프록시가 먼저 끊으면 504
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 인터뷰 첨부 업로드 20MB(백엔드 한도) — nginx 기본 1MB면 413
        client_max_body_size 25m;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js HMR/웹소켓 (개발 모드 대비)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
